[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sparcalc"
version = "0.1.0"
description = "Wing spar beam deflection and shear-flow analysis for the GDX Aerospace ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GDX Tech Co. Ltd" }]
dependencies = [
    "numpy>=1.26",
    "aerocalc",
    "aerostruct",
    "stresspy",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/sparcalc"]

[tool.uv.sources]
aerocalc = { workspace = true }
aerostruct = { workspace = true }
stresspy = { workspace = true }
compositepy = { workspace = true }
