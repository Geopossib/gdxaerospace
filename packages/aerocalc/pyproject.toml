[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aerocalc"
version = "0.1.0"
description = "Core aerodynamic/atmospheric calculations for the GDX Aerospace ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GDX Tech Co. Ltd" }]
dependencies = [
    "numpy>=1.26",
    "aerounits",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aerocalc"]

[tool.uv.sources]
aerounits = { workspace = true }
