[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aerodata"
version = "0.1.0"
description = "Aerospace-aware flight-test and telemetry data analysis (filtering, resampling, outlier detection) for the GDX Aerospace ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GDX Tech Co. Ltd" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "aerocalc",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aerodata"]

[tool.uv.sources]
aerocalc = { workspace = true }
