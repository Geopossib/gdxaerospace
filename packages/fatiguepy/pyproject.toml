[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fatiguepy"
version = "0.1.0"
description = "S-N (Basquin) fatigue life estimation and Miner's-rule cumulative damage for the GDX Aerospace ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GDX Tech Co. Ltd" }]
dependencies = [
    "aerocalc",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/fatiguepy"]

[tool.uv.sources]
aerocalc = { workspace = true }
aerostruct = { workspace = true }
stresspy = { workspace = true }
compositepy = { workspace = true }
