[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeroopt"
version = "0.1.0"
description = "A SciPy-based optimization wrapper and worked aerospace design-optimization examples for the GDX Aerospace ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GDX Tech Co. Ltd" }]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "aerocalc",
    "wingtools",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aeroopt"]

[tool.uv.sources]
aerocalc = { workspace = true }
wingtools = { workspace = true }
