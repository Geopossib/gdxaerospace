[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gdxaerospace"
version = "1.0.0"
description = "GDX Aerospace — the unified meta-package for the full aerospace engineering ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GDX Tech Co. Ltd" }]
dependencies = [
    "aerocalc",
    "aerounits",
    "airfoilpy",
    "wingtools",
    "dragpy",
    "compressibleflow",
    "shockpy",
    "boundarylayer",
    "aeroprop",
    "rocketperf",
    "nozzleanalysis",
    "combustionpy",
    "turbomachpy",
    "electricprop",
    "plasmathrust",
    "plume3d",
    "plasmaspace",
    "attitude3d",
    "flightdyn",
    "aircraftsim",
    "guidancepy",
    "navigationpy",
    "autopilotpy",
    "kalmanflight",
    "orbitpy",
    "tletools",
    "satprop",
    "groundtrack",
    "missionpy",
    "constellationpy",
    "sattelemetry",
    "aeromaterials",
    "aerostruct",
    "stresspy",
    "sparcalc",
    "bucklingpy",
    "fatiguepy",
    "compositepy",
    "laminatepy",
    "aerothermal",
    "aerocfd",
    "aerodata",
    "uavpy",
    "aerovision",
    "rockettraj",
    "aeroopt",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gdxaerospace"]

[tool.uv.sources]
aerocalc = { workspace = true }
