[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aerostruct"
version = "0.1.0"
description = "Cross-section geometric property calculations (area, centroid, moment of inertia) for the GDX Aerospace ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GDX Tech Co. Ltd" }]
dependencies = [
    "numpy>=1.26",
    "aerocalc",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aerostruct"]

[tool.uv.sources]
aerocalc = { workspace = true }
aerostruct = { workspace = true }
stresspy = { workspace = true }
compositepy = { workspace = true }
