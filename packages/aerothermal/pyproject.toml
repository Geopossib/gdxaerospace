[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aerothermal"
version = "0.1.0"
description = "Conduction, convection, radiation, and spacecraft thermal-balance calculations for the GDX Aerospace ecosystem"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "GDX Tech Co. Ltd" }]
dependencies = [
    "aerocalc",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aerothermal"]

[tool.uv.sources]
aerocalc = { workspace = true }
