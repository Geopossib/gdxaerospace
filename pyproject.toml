[project]
name = "gdxaerospace-workspace"
version = "0.1.0"
description = "GDX Aerospace — a professional Python ecosystem for aerospace engineering"
requires-python = ">=3.11"

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N", "D"]
# D203/D213: conflicting blank-line conventions, we use D211/D212 instead.
# D105/D107: dunder methods (__init__, __repr__) document via the class docstring.
ignore = ["D203", "D213", "D105", "D107"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages", "tests"]
addopts = "-ra -q --doctest-modules"
